[package]
name = "wsnet-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "wsnet node client: hub sessions, SOCKS5 listener, local forwards"

[dependencies]
wsnet-limits.workspace = true
wsnet-protocol.workspace = true
wsnet-crypto.workspace = true
wsnet-operation.workspace = true
wsnet-stream.workspace = true
wsnet-transport.workspace = true
wsnet-routing.workspace = true
wsnet-socks.workspace = true
wsnet-forward.workspace = true
wsnet-config.workspace = true
wsnet-session.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
reqwest.workspace = true
futures-util.workspace = true
bytes.workspace = true
base64.workspace = true
rand.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
hex.workspace = true
ipnet.workspace = true

[dev-dependencies]
# The end-to-end acceptance test runs a real Hub in-process against a real node,
# so the two halves are exercised over actual HTTP/SSE rather than a stub.
wsnet-hub.workspace = true
# Test binaries install no subscriber by default, which makes a hung acceptance
# test produce no output at all; this is what makes `RUST_LOG` work here.
tracing-subscriber.workspace = true
# The TLS-front acceptance test terminates TLS itself (nginx is not available in
# this environment) and must generate the certificate it serves, so that outer TLS
# is exercised against a real chain rather than asserted about.
rcgen.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true

